[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mt3"
dynamic = ["version"]
description = "Multi-Task Multitrack Music Transcription"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
dependencies = [
  "absl-py",
  "flax",
  "gin-config",
  "huggingface-hub>=0.26",
  "immutabledict",
  "librosa",
  "mir-eval",
  "mido>=1.3,<2",
  "nltk==3.9.1",
  "note-seq",
  "numpy",
  "pretty-midi",
  "protobuf>=6.31,<6.33",
  "scikit-learn",
  "scipy",
  "seqio",
  "t5",
  "t5x",
  "tensorflow",
  "tensorflow-datasets",
  "pyfluidsynth>=1.4.0",
]

[project.scripts]
mt3-transcribe = "mt3.cli:main"
mt3-download-model = "mt3.model_download:main"
mt3-evaluate = "mt3.scripts.evaluate_checkpoint:main"
mt3-export = "mt3.scripts.export_transcription:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[project.urls]
Repository = "https://github.com/magenta/mt3"

[tool.setuptools.dynamic]
version = {attr = "mt3.version.__version__"}

[tool.setuptools.package-data]
mt3 = ["gin/*.gin", "gin/**/*.gin"]

[tool.uv]
required-version = ">=0.9.20,<0.10"
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
override-dependencies = [
  "seqio-nightly; sys_platform != 'darwin'",
  "tensorflow-cpu; sys_platform != 'darwin'",
  "tfds-nightly; sys_platform != 'darwin'",
  "flax @ git+https://github.com/google/flax@c31deb2b8ec8d0cc1b2092aa81890823d21a4739",
]

[tool.uv.sources]
# Every git source is pinned to the commit uv.lock already resolved, so an
# image rebuild can never re-resolve to a moving HEAD. Two outages in one week
# came from exactly that (the flax override below, and the TF stack pin), and
# on 2026-08-26 a rebuild from a byte-identical pyproject.toml failed where the
# previous one had succeeded: t5x declares its own UNPINNED flax URL, and which
# of the two flax URLs wins the resolution is evidently not deterministic. The
# override alone therefore isn't enough -- flax is pinned here as well, so the
# project's own direct dependency names one exact commit no matter what t5x asks
# for. Bump these deliberately, never by leaving them to drift.
note-seq = { git = "https://github.com/magenta/note-seq", rev = "35825508885343fb06f93dc87ff491dbbf034505" }
seqio = { git = "https://github.com/google/seqio", rev = "aaa0e111c5e9d8fb49bfa992f2272a121a95f741" }
t5x = { git = "https://github.com/google-research/t5x", rev = "2045b332cf19887885a74ef1bd6b2adb2a7ca634" }
flax = { git = "https://github.com/google/flax", rev = "c31deb2b8ec8d0cc1b2092aa81890823d21a4739" }
