[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mt3"
dynamic = ["version"]
description = "Multi-Task Multitrack Music Transcription"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
dependencies = [
  "absl-py",
  "flax",
  "gin-config",
  "huggingface-hub>=0.26",
  "immutabledict",
  "librosa",
  "mir-eval",
  "mido>=1.3,<2",
  "nltk==3.9.1",
  "note-seq",
  "numpy",
  "pretty-midi",
  "protobuf>=6.31,<6.33",
  "scikit-learn",
  "scipy",
  "seqio",
  "t5",
  "t5x",
  "tensorflow",
  "tensorflow-datasets",
  "pyfluidsynth>=1.4.0",
]

[project.scripts]
mt3-transcribe = "mt3.cli:main"
mt3-download-model = "mt3.model_download:main"
mt3-evaluate = "mt3.scripts.evaluate_checkpoint:main"
mt3-export = "mt3.scripts.export_transcription:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[project.urls]
Repository = "https://github.com/magenta/mt3"

[tool.setuptools.dynamic]
version = {attr = "mt3.version.__version__"}

[tool.setuptools.package-data]
mt3 = ["gin/*.gin", "gin/**/*.gin"]

[tool.uv]
required-version = ">=0.9.20,<0.10"
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
override-dependencies = [
  "seqio-nightly; sys_platform != 'darwin'",
  "tensorflow-cpu; sys_platform != 'darwin'",
  "tfds-nightly; sys_platform != 'darwin'",
  "flax @ git+https://github.com/google/flax@c31deb2b8ec8d0cc1b2092aa81890823d21a4739",
]

[tool.uv.sources]
# Every git source names an exact commit, so `uv lock` / `uv sync` can never
# re-resolve to a moving HEAD. Bump them deliberately, never by drift.
#
# THESE PINS DO NOT REACH THE MODAL IMAGE. An earlier version of this comment
# claimed they did; they don't. The image installs with `uv pip install`, the
# pip-compatible interface, which does not apply this table at all -- a build
# on 2026-08-26 fetched all four sources at HEAD and pulled flax 01854da
# (0.12.9, Python>=3.12) straight past the pin below, failing on the image's
# Python 3.11. What the image actually honors is the explicit
# `--override modal-overrides.txt` passed on its install command; keep the flax
# rev here and in that file in sync.
note-seq = { git = "https://github.com/magenta/note-seq", rev = "35825508885343fb06f93dc87ff491dbbf034505" }
seqio = { git = "https://github.com/google/seqio", rev = "aaa0e111c5e9d8fb49bfa992f2272a121a95f741" }
t5x = { git = "https://github.com/google-research/t5x", rev = "2045b332cf19887885a74ef1bd6b2adb2a7ca634" }
flax = { git = "https://github.com/google/flax", rev = "c31deb2b8ec8d0cc1b2092aa81890823d21a4739" }
